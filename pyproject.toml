[project]
name = "detect_rank"
dynamic = ["version"]  # Change the version in __init__.py in the package directory.
description = "mSCAPE, Kraken2 classification for x rank with ONYX integration"
authors = [{name = "Mike Brown", email = "michael.d.brown@ukhsa.gov.uk"}]
requires-python = ">=3.14"
# Pin versions of possibly unstable dependencies or packages (especially internal)
dependencies = ["pandas", "pyyaml", "climb-onyx-client", "typer"]  

[tool.setuptools.dynamic]
version = {attr = "detect_rank.detect_rank.__version__"} # Add package name here to get version

[project.optional-dependencies] # Dependencies for developers only - add more if required
dev = ["ruff", "pytest", "pre-commit"]

[build-system] # Leave this section
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts] # Update with main repo script here
find-rank = "detect_rank.cli:app"

[tool.ruff.lint] # Lint rules to follow - add or delete if required
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # comprehesnions
    "C4",
    # pathlib
    "PTH",
]

ignore = ["E501"] # Lint rules to ignore - add or remove as required

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
